
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<title>ANAS PRO — Music & Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b09;--panel:#111813;--panel2:#19241c;--line:#29382d;--text:#f4f8f3;--muted:#94a397;--green:#baff70;--green2:#7fca43}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}
button,input{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.app{min-height:100vh;padding-bottom:115px}
.sidebar{position:fixed;inset:0 auto 0 0;width:240px;padding:25px 18px;background:#0b100d;border-right:1px solid var(--line);z-index:20;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:11px;margin:5px 8px 42px}
.logo-mark{width:40px;height:40px;border-radius:13px;background:var(--green);color:#10170d;display:grid;place-items:center;font:900 23px Outfit;box-shadow:0 0 30px #baff7040}
.logo-name{font:900 23px Outfit;letter-spacing:2px}.logo-name span{color:var(--green)}
.nav-label{font-size:10px;letter-spacing:2px;color:#718075;font-weight:800;margin:0 12px 12px}
.nav{display:grid;gap:7px}
.nav button{border:0;background:transparent;color:#9aa79e;text-align:left;padding:13px 14px;border-radius:13px;display:flex;gap:13px;align-items:center;font-weight:700;transition:.25s}
.nav button:hover,.nav button.active{background:#1c2a20;color:var(--green);transform:translateX(3px)}
.nav-icon{width:20px;text-align:center;font-size:18px}
.side-bottom{margin-top:auto;border:1px solid #354a35;border-radius:18px;padding:17px;background:linear-gradient(140deg,#253724,#111a14)}
.side-bottom strong{font:700 15px Outfit}.side-bottom p{color:var(--muted);font-size:12px;line-height:1.6}
.main{margin-left:240px;padding:24px 34px 45px;max-width:1600px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:27px}
.mobile-brand{display:none;font:900 20px Outfit}
.search{position:relative;width:min(450px,100%)}
.search input{width:100%;background:#111813;border:1px solid var(--line);border-radius:14px;padding:13px 15px 13px 43px;color:white;outline:none}
.search input:focus{border-color:var(--green)}
.search span{position:absolute;left:15px;top:9px;color:#9eada2;font-size:20px}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#111813;color:white;border-radius:30px;padding:5px 12px 5px 5px;font-weight:700;font-size:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#10170d;display:grid;place-items:center;font:900 16px Outfit;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero{min-height:365px;border-radius:27px;overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:36px;border:1px solid #334338;background:linear-gradient(90deg,#050a08f5,#050a0870 55%,#050a0810),linear-gradient(0deg,#050a0866,transparent),url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1800&q=90") center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#baff7010 70%,transparent);animation:shine 8s infinite}
.hero-content{max-width:620px;position:relative;z-index:1;animation:rise .8s both}
.eyebrow{color:var(--green);font-size:11px;letter-spacing:3px;font-weight:900}
.hero h1{font:900 clamp(40px,5vw,68px)/.98 Outfit;margin:14px 0}
.hero h1 span{color:var(--green);text-shadow:0 0 35px #baff7040}
.hero p{color:#c4d0c6;line-height:1.7;max-width:470px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}
.primary,.secondary{border:0;border-radius:12px;padding:13px 18px;font-weight:800;transition:.2s}
.primary{background:var(--green);color:#10170d}.primary:hover{background:#d4ffa3;transform:translateY(-2px);box-shadow:0 8px 25px #baff7030}
.secondary{background:#ffffff16;border:1px solid #ffffff35;color:white}.secondary:hover{background:#ffffff28}
.section{margin-top:37px;animation:rise .55s both}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:17px}
.section-head h2{font:800 24px Outfit;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.text-btn{border:0;background:none;color:var(--green);font-size:11px;font-weight:900}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.quick-card{min-height:115px;border:1px solid var(--line);border-radius:18px;padding:17px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1a281e,#101713);cursor:pointer;transition:.3s}
.quick-card:hover{transform:translateY(-5px);border-color:#718d5d;box-shadow:0 15px 35px #0005}
.quick-icon{width:46px;height:46px;border-radius:14px;background:#baff7018;color:var(--green);display:grid;place-items:center;font-size:22px}
.quick-card strong{font:700 16px Outfit}.quick-card small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{min-width:0;animation:rise .5s both}
.cover{position:relative;aspect-ratio:1;border-radius:17px;overflow:hidden;background:linear-gradient(135deg,#273c2c,#101813);isolation:isolate}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .55s,filter .4s}
.card:hover .cover img{transform:scale(1.08);filter:brightness(.78)}
.cover:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#0009);pointer-events:none}
.cover-actions{position:absolute;z-index:2;right:9px;top:9px;display:flex;gap:6px}
.round{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff40;background:#080b0bc9;color:white;display:grid;place-items:center}
.round.liked{color:var(--green);border-color:var(--green)}
.play-cover{position:absolute;z-index:2;right:11px;bottom:11px;width:43px;height:43px;border-radius:50%;border:0;background:var(--green);color:#10170d;box-shadow:0 4px 20px #0007;transition:.2s}
.play-cover:hover{transform:scale(1.1)}
.card h3{font:700 15px Outfit;margin:11px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--muted)}
.tag{display:inline-block;color:var(--green);background:#baff7015;border:1px solid #baff7030;border-radius:20px;padding:5px 8px;font-size:9px;font-weight:900;margin-top:8px}
.movie-card .cover{aspect-ratio:4/5}
.page-title{font:900 38px Outfit;margin:12px 0 7px}.page-desc{color:var(--muted);font-size:13px;margin:0 0 24px;line-height:1.6}
.empty{border:1px dashed #35473a;border-radius:19px;padding:40px 18px;text-align:center;color:var(--muted);line-height:1.6}
.empty strong{display:block;color:white;font:700 19px Outfit;margin-bottom:7px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.upload-label{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#10170d;border-radius:12px;padding:12px 15px;font-size:12px;font-weight:900;cursor:pointer}
.upload-label input{display:none}
.player{position:fixed;z-index:30;left:240px;right:0;bottom:0;min-height:88px;background:#101713f2;backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:18px;padding:12px 25px}
.now{display:flex;align-items:center;gap:11px;min-width:0}
.now img{width:49px;height:49px;border-radius:10px;object-fit:cover;background:#26352b}
.now strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.controls{display:flex;align-items:center;justify-content:center;gap:17px}
.controls button{border:0;background:none;color:#e8f0e9;font-size:17px}
.controls .main-play{background:var(--green);color:#10170d;width:39px;height:39px;border-radius:50%;font-size:14px}
.progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:9px;margin-top:7px}
input[type=range]{accent-color:var(--green);min-width:0}
#seek{width:100%}
.player-right{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:#9eada2}
.player-right input{width:75px}
.modal-backdrop{position:fixed;inset:0;background:#000c;z-index:60;display:none;align-items:center;justify-content:center;padding:17px;backdrop-filter:blur(7px)}
.modal-backdrop.show{display:flex;animation:fade .2s}
.modal{width:min(500px,100%);max-height:88vh;overflow:auto;background:#111a14;border:1px solid #3b503e;border-radius:22px;padding:22px;box-shadow:0 25px 90px #0009;animation:rise .3s}
.modal h2{font:800 24px Outfit;margin:0 0 9px}.modal p{color:var(--muted);font-size:13px;line-height:1.6}
.modal input{width:100%;background:#080d0a;border:1px solid var(--line);border-radius:11px;color:white;padding:13px;margin:9px 0;outline:none}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:17px}
.video-box{width:100%;aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden;margin-top:14px}
.video-box video{width:100%;height:100%}
.toast{position:fixed;z-index:100;bottom:115px;left:50%;transform:translateX(-50%);background:var(--green);color:#10170d;border-radius:30px;padding:11px 17px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.profile-box{display:flex;align-items:center;gap:18px;padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:20px;margin:20px 0}
.profile-big{width:75px;height:75px;border-radius:50%;background:var(--green);color:#10170d;display:grid;place-items:center;font:900 30px Outfit;overflow:hidden}
.profile-big img{width:100%;height:100%;object-fit:cover}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shine{0%,100%{opacity:.1;transform:translateX(-15%)}50%{opacity:.8;transform:translateX(15%)}}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){
 .sidebar{display:none}.main{margin:0;padding:15px 15px 35px}.topbar{margin-bottom:18px}
 .mobile-brand{display:block}.search{max-width:none}.profile-btn span{display:none}
 .hero{min-height:355px;padding:23px 20px;background-position:58% center}
 .hero h1{font-size:43px}.hero p{font-size:12px}
 .quick-grid{grid-template-columns:1fr 1fr;gap:9px}.quick-card{min-height:94px;padding:12px;gap:9px}
 .quick-icon{width:38px;height:38px;font-size:18px}.quick-card strong{font-size:13px}.quick-card small{font-size:9px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 11px}
 .section{margin-top:29px}.section-head h2{font-size:21px}.page-title{font-size:32px}
 .player{left:0;right:0;bottom:64px;min-height:75px;padding:8px 12px;grid-template-columns:1fr auto;gap:8px}
 .now img{width:42px;height:42px}.now strong{font-size:11px}.controls{gap:12px}.controls button{font-size:15px}
 .controls .main-play{width:35px;height:35px}
 .progress{position:absolute;left:0;right:0;bottom:-1px;margin:0;gap:4px}.progress span{display:none}
 #seek{height:3px}
 .player-right{display:none}
 .mobile-nav{display:flex;position:fixed;z-index:35;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:#0b100ef5;border-top:1px solid var(--line);justify-content:space-around;align-items:center}
 .mobile-nav button{border:0;background:none;color:#91a096;font-size:9px;display:grid;gap:3px;justify-items:center}
 .mobile-nav button b{font-size:18px;font-weight:400}.mobile-nav button.active{color:var(--green)}
 .toast{bottom:150px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="logo"><div class="logo-mark">A</div><div class="logo-name">ANAS<span>.</span></div></div>
 <div class="nav-label">YOUR SPACE</div>
 <nav class="nav">
  <button class="active" data-page="home"><span class="nav-icon">⌂</span>Home</button>
  <button data-page="music"><span class="nav-icon">♫</span>Music</button>
  <button data-page="cinema"><span class="nav-icon">▣</span>Cinema</button>
  <button data-page="favorites"><span class="nav-icon">♡</span>Favorites</button>
  <button data-page="library"><span class="nav-icon">▤</span>Library</button>
  <button data-page="profile"><span class="nav-icon">◉</span>My Profile</button>
 </nav>
 <div class="side-bottom"><strong>YOUR WORLD. YOUR SOUND.</strong><p>One space for your music, your playlists and your cinema moments.</p></div>
</aside>

<main class="main">
<header class="topbar">
 <div class="mobile-brand">ANAS<span style="color:var(--green)">.</span></div>
 <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search music, movies..."></label>
 <button class="profile-btn" id="profileShortcut"><div class="avatar" id="smallAvatar">A</div><span id="smallName">MY PROFILE</span></button>
</header>
<div id="content"></div>
</main>

<div class="player">
 <div class="now"><img id="nowCover" src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=200&q=80" alt="Cover">
 <div style="min-width:0"><strong id="nowTitle">Choose something to play</strong><small id="nowArtist">ANAS PLAYER</small></div></div>
 <div><div class="controls"><button id="prev" aria-label="Previous">⏮</button><button class="main-play" id="play" aria-label="Play">▶</button><button id="next" aria-label="Next">⏭</button></div>
 <div class="progress"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div>
 <div class="player-right">♪ <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div>
</div>

<nav class="mobile-nav">
 <button class="active" data-page="home"><b>⌂</b>Home</button>
 <button data-page="music"><b>♫</b>Music</button>
 <button data-page="cinema"><b>▣</b>Cinema</button>
 <button data-page="favorites"><b>♡</b>Saved</button>
 <button data-page="library"><b>▤</b>Library</button>
</nav>
<div class="modal-backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>
</div>

<script>
const $=s=>document.querySelector(s),content=$("#content"),audio=$("#audio");
const images={
 hero:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1800&q=90",
 headphones:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=700&q=85",
 studio:"https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=700&q=85",
 concert:"https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=700&q=85",
 night:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=700&q=85",
 film:"https://images.unsplash.com/photo-1440404653325-ab127d49eac1?w=900&q=85",
 space:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=900&q=85",
 road:"https://images.unsplash.com/photo-1500534623283-312aade485b7?w=900&q=85"
};
const demos=[
{id:"demo1",title:"SoundHelix One",artist:"Demo audio",cover:images.headphones,url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
{id:"demo2",title:"SoundHelix Two",artist:"Demo audio",cover:images.studio,url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
{id:"demo3",title:"SoundHelix Three",artist:"Demo audio",cover:images.concert,url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
{id:"demo4",title:"SoundHelix Four",artist:"Demo audio",cover:images.night,url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"}
];
const films=[
{id:"film1",title:"Big Buck Bunny",genre:"Animation",year:"2008",cover:images.film,desc:"An open animated movie sample used to demonstrate online playback.",url:"https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},
{id:"film2",title:"Sintel",genre:"Fantasy",year:"2010",cover:images.space,desc:"An open movie sample from the Blender Foundation.",url:"https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"},
{id:"film3",title:"Tears of Steel",genre:"Science fiction",year:"2012",cover:images.road,desc:"A science-fiction open movie sample. Online playback only.",url:"https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"},
{id:"film4",title:"Elephants Dream",genre:"Animation",year:"2006",cover:images.concert,desc:"An open animated movie sample from the Blender Foundation.",url:"https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"}
];
let page="home",localTracks=[],current=null,queue=[],queueIndex=-1,activePlaylist=null,term="";
let favs=JSON.parse(localStorage.getItem("anas_favs_v2")||"[]");
let lists=JSON.parse(localStorage.getItem("anas_lists_v2")||"[]");
let profile=JSON.parse(localStorage.getItem("anas_profile_v2")||'{"name":"ANAS","bio":"Music lover · Cinema explorer"}');
let objectUrls=[];
const allTracks=()=>[...demos,...localTracks];
const saveFav=()=>localStorage.setItem("anas_favs_v2",JSON.stringify(favs));
const saveLists=()=>localStorage.setItem("anas_lists_v2",JSON.stringify(lists));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function clock(n){return Number.isFinite(n)?Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0"):"0:00"}
function avatar(){return esc((profile.name||"A").trim().charAt(0).toUpperCase()||"A")}
function updateProfileUI(){$("#smallAvatar").textContent=avatar();$("#smallName").textContent=profile.name||"MY PROFILE"}
function setPage(p){page=p;activePlaylist=null;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
$("#profileShortcut").onclick=()=>setPage("profile");
$("#search").addEventListener("input",e=>{term=e.target.value.toLowerCase().trim();render()});
function section(title,sub,html,more=""){return `<section class="section"><div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div>${more}</div>${html}</section>`}
function grid(a){return `<div class="cards">${a.join("")}</div>`}
function trackCard(t){return `<article class="card"><div class="cover"><img src="${esc(t.cover)}" alt="" loading="lazy"><div class="cover-actions"><button class="round ${favs.includes(t.id)?"liked":""}" data-fav="${esc(t.id)}">♥</button><button class="round" data-add="${esc(t.id)}">＋</button></div><button class="play-cover" data-play="${esc(t.id)}">▶</button></div><h3>${esc(t.title)}</h3><div class="sub">${esc(t.artist)}</div><span class="tag">${t.local?"YOUR UPLOAD":"DEMO AUDIO"}</span></article>`}
function filmCard(m){return `<article class="card movie-card"><div class="cover"><img src="${esc(m.cover)}" alt="" loading="lazy"><div class="cover-actions"><button class="round" data-movie="${m.id}">＋</button></div><button class="play-cover" data-movie="${m.id}">▶</button></div><h3>${esc(m.title)}</h3><div class="sub">${esc(m.genre)} · ${esc(m.year)}</div><span class="tag">OPEN MOVIE SAMPLE</span></article>`}
function render(){
 let ts=allTracks().filter(t=>(t.title+" "+t.artist).toLowerCase().includes(term));
 let ms=films.filter(m=>(m.title+" "+m.genre).toLowerCase().includes(term));
 if(page==="home"){
 content.innerHTML=`<section class="hero"><div class="hero-content"><div class="eyebrow">WELCOME TO YOUR WORLD</div><h1>Feel the sound.<br><span>See the story.</span></h1><p>Music, movies and your personal collection — all in one beautifully designed space.</p><div class="actions"><button class="primary" data-go="music">Explore music →</button><button class="secondary" data-go="cinema">Discover cinema</button></div></div></section>
 <section class="section"><div class="quick-grid"><div class="quick-card" data-go="music"><div class="quick-icon">♫</div><div><strong>Music</strong><small>Your own sound</small></div></div><div class="quick-card" data-go="cinema"><div class="quick-icon">▣</div><div><strong>Cinema</strong><small>Open movie samples</small></div></div><div class="quick-card" data-go="library"><div class="quick-icon">＋</div><div><strong>My Library</strong><small>Upload and organize</small></div></div></div></section>
 ${section("Made for your mood","Sample audio to explore",grid(ts.slice(0,4).map(trackCard)),'<button class="text-btn" data-go="music">VIEW ALL →</button>')}
 ${section("Cinema spotlight","Open movie samples · online playback",grid(ms.slice(0,4).map(filmCard)),'<button class="text-btn" data-go="cinema">VIEW ALL →</button>')}`;
 }else if(page==="music"){
 content.innerHTML=`<h1 class="page-title">Music</h1><p class="page-desc">Discover demo audio or listen to music you upload.</p>${section("All tracks","Choose a track to start listening",ts.length?grid(ts.map(trackCard)):'<div class="empty"><strong>No tracks found</strong>Try another search.</div>')}`;
 }else if(page==="cinema"){
 content.innerHTML=`<h1 class="page-title">Cinema</h1><p class="page-desc">A selection of open movie samples for online viewing.</p>${section("Explore films","These are sample films, not a commercial movie catalogue.",ms.length?grid(ms.map(filmCard)):'<div class="empty"><strong>No films found</strong>Try another search.</div>')}`;
 }else if(page==="favorites"){
 let f=ts.filter(t=>favs.includes(t.id));content.innerHTML=`<h1 class="page-title">Favorites</h1><p class="page-desc">Your saved tracks.</p>${f.length?grid(f.map(trackCard)):'<div class="empty"><strong>No favorites yet</strong>Tap the heart on a track to save it.</div>'}`;
 }else if(page==="library"){
 content.innerHTML=`<h1 class="page-title">My Library</h1><p class="page-desc">Your uploads and playlists are stored in this browser.</p><div class="tools"><label class="upload-label">＋ Upload audio<input id="upload" type="file" accept="audio/*" multiple></label><button class="secondary" id="newList">＋ Create playlist</button></div>
 ${section("Your playlists","Create and share your collections",lists.length?grid(lists.map((p,i)=>`<article class="card"><div class="cover" style="display:grid;place-items:center;background:linear-gradient(140deg,#344a32,#101813);font-size:48px">♫</div><h3>${esc(p.name)}</h3><div class="sub">${p.tracks.length} tracks</div><button class="text-btn" data-openlist="${i}">OPEN →</button><button class="text-btn" data-share="${i}">SHARE ↗</button></article>`)):'<div class="empty"><strong>No playlists yet</strong>Create one and add tracks using the plus button.</div>')}
 ${section("Your uploads","Files saved on this device",localTracks.length?grid(localTracks.map(t=>`${trackCard(t).replace("</article>",`<button class="text-btn" data-delete="${esc(t.id)}">DELETE UPLOAD</button></article>`)}`)):'<div class="empty"><strong>No uploads yet</strong>Add audio files from your device.</div>')}`;
 $("#upload").addEventListener("change",e=>uploadFiles(e.target.files));$("#newList").onclick=createPlaylist;
 }else if(page==="profile"){
 content.innerHTML=`<h1 class="page-title">My Profile</h1><p class="page-desc">Your personal ANAS space on this device.</p><div class="profile-box"><div class="profile-big" id="bigAvatar">${avatar()}</div><div><h2 style="font:800 23px Outfit;margin:0">${esc(profile.name)}</h2><p style="color:var(--muted);margin:6px 0">${esc(profile.bio)}</p><span class="tag">LOCAL PROFILE</span></div></div><button class="primary" id="editProfile">Edit profile</button><p class="page-desc" style="margin-top:20px">This profile is saved in this browser only. It is not an online account and does not sync to other devices.</p>`;
 $("#editProfile").onclick=editProfile;
 }
 if(activePlaylist!==null)renderPlaylist();
}
function renderPlaylist(){
 const p=lists[activePlaylist];if(!p){activePlaylist=null;render();return}
 const tracks=p.tracks.map(id=>allTracks().find(t=>t.id===id)).filter(Boolean);
 content.innerHTML=`<button class="text-btn" id="backLibrary">← BACK TO LIBRARY</button><h1 class="page-title">${esc(p.name)}</h1><p class="page-desc">${tracks.length} tracks</p><div class="tools"><button class="primary" id="shareThis">Share playlist ↗</button><button class="secondary" id="deleteList">Delete playlist</button></div>${tracks.length?grid(tracks.map(t=>`${trackCard(t).replace("</article>",`<button class="text-btn" data-remove="${esc(t.id)}">REMOVE FROM PLAYLIST</button></article>`)}`)):'<div class="empty"><strong>This playlist is empty</strong>Add tracks using the plus button on a music card.</div>'}`;
 $("#backLibrary").onclick=()=>{activePlaylist=null;render()};$("#deleteList").onclick=()=>{lists.splice(activePlaylist,1);saveLists();activePlaylist=null;render();toast("Playlist deleted")};$("#shareThis").onclick=()=>sharePlaylist(activePlaylist);
}
async function playTrack(id,list){
 const source=list||allTracks(),i=source.findIndex(t=>t.id===id);if(i<0)return;
 queue=source;queueIndex=i;current=source[i];audio.src=current.url;audio.load();
 $("#nowTitle").textContent=current.title;$("#nowArtist").textContent=current.artist;$("#nowCover").src=current.cover;
 try{await audio.play()}catch(e){toast("Playback unavailable. Check your connection or file.") }
}
function togglePlay(){if(!current){if(allTracks()[0])playTrack(allTracks()[0].id);return}if(audio.paused)audio.play().catch(()=>toast("Cannot play this audio"));else audio.pause()}
$("#play").onclick=togglePlay;$("#prev").onclick=()=>{if(queue.length)playTrack(queue[(queueIndex-1+queue.length)%queue.length].id,queue)};
$("#next").onclick=()=>{if(queue.length)playTrack(queue[(queueIndex+1)%queue.length].id,queue)};
audio.addEventListener("play",()=>$("#play").textContent="Ⅱ");audio.addEventListener("pause",()=>$("#play").textContent="▶");
audio.addEventListener("timeupdate",()=>{if(audio.duration){$("#seek").value=audio.currentTime/audio.duration*100;$("#currentTime").textContent=clock(audio.currentTime);$("#duration").textContent=clock(audio.duration)}});
audio.addEventListener("ended",()=>$("#next").click());
$("#seek").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
$("#volume").oninput=e=>audio.volume=Number(e.target.value);
function openModal(html){$("#modal").innerHTML=html;$("#backdrop").classList.add("show")}
function closeModal(){$("#backdrop").classList.remove("show")}
$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")closeModal()};
function createPlaylist(){
 openModal(`<h2>New playlist</h2><p>Choose a name for your collection.</p><input id="listName" maxlength="35" placeholder="My favorite music"><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="create">Create</button></div>`);
 $("#cancel").onclick=closeModal;$("#create").onclick=()=>{let name=$("#listName").value.trim();if(!name){toast("Enter a playlist name");return}lists.push({name,tracks:[]});saveLists();closeModal();render();toast("Playlist created")};
}
function addToList(id){
 if(!lists.length){toast("Create a playlist first");return}
 openModal(`<h2>Add to playlist</h2><p>Choose a playlist.</p>${lists.map((p,i)=>`<button class="secondary" style="width:100%;margin:5px 0;text-align:left" data-pick="${i}">${esc(p.name)}</button>`).join("")}<div class="modal-actions"><button class="secondary" id="cancel">Close</button></div>`);
 $("#cancel").onclick=closeModal;document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{let p=lists[Number(b.dataset.pick)];if(!p.tracks.includes(id))p.tracks.push(id);saveLists();closeModal();toast("Added to playlist")});
}
async function sharePlaylist(i){
 const p=lists[i];if(!p)return;
 const names=p.tracks.map(id=>allTracks().find(t=>t.id===id)?.title).filter(Boolean);
 const message=`ANAS playlist: ${p.name}\n${names.join("\n")}\n\nOpen ANAS: ${location.href}`;
 try{if(navigator.share)await navigator.share({title:p.name,text:message});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(message);toast("Playlist details copied")}else{openModal(`<h2>Share playlist</h2><p>Copy these playlist details and send them.</p><input readonly value="${esc(p.name+" — "+names.join(", "))}"><div class="modal-actions"><button class="primary" id="closeShare">Close</button></div>`);$("#closeShare").onclick=closeModal}}catch(e){if(e.name!=="AbortError")toast("Could not share right now")}
}
function editProfile(){
 openModal(`<h2>Edit profile</h2><p>Change the name and short description shown on this device.</p><input id="profileName" maxlength="24" value="${esc(profile.name)}" placeholder="Your name"><input id="profileBio" maxlength="70" value="${esc(profile.bio)}" placeholder="A short bio"><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="saveProfile">Save profile</button></div>`);
 $("#cancel").onclick=closeModal;$("#saveProfile").onclick=()=>{profile.name=$("#profileName").value.trim()||"ANAS";profile.bio=$("#profileBio").value.trim();localStorage.setItem("anas_profile_v2",JSON.stringify(profile));updateProfileUI();closeModal();render();toast("Profile updated")};
}
function showMovie(id){
 const m=films.find(x=>x.id===id);if(!m)return;
 openModal(`<div class="eyebrow">ANAS CINEMA · OPEN SAMPLE</div><h2>${esc(m.title)}</h2><p>${esc(m.desc)}<br>${esc(m.genre)} · ${esc(m.year)}</p><div class="video-box"><video controls playsinline preload="metadata" poster="${esc(m.cover)}"><source src="${esc(m.url)}" type="video/mp4"></video></div><div class="modal-actions"><button class="secondary" id="closeMovie">Close</button></div>`);
 $("#closeMovie").onclick=closeModal;
}
content.addEventListener("click",e=>{
 const b=e.target.closest("button,[data-go],.quick-card");if(!b)return;
 if(b.dataset.go){setPage(b.dataset.go);return}
 if(b.dataset.play){playTrack(b.dataset.play);return}
 if(b.dataset.fav){let id=b.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFav();render();toast(favs.includes(id)?"Saved to favorites":"Removed from favorites");return}
 if(b.dataset.add){addToList(b.dataset.add);return}
 if(b.dataset.movie){showMovie(b.dataset.movie);return}
 if(b.dataset.openlist!==undefined){activePlaylist=Number(b.dataset.openlist);renderPlaylist();return}
 if(b.dataset.share!==undefined){sharePlaylist(Number(b.dataset.share));return}
 if(b.dataset.remove){let p=lists[activePlaylist];p.tracks=p.tracks.filter(x=>x!==b.dataset.remove);saveLists();renderPlaylist();return}
 if(b.dataset.delete){deleteLocal(b.dataset.delete);return}
});
function dbOpen(){return new Promise((resolve,reject)=>{
 if(!window.indexedDB){reject(Error("IndexedDB unavailable"));return}
 const r=indexedDB.open("ANAS_PRO_AUDIO",1);
 r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("tracks"))r.result.createObjectStore("tracks",{keyPath:"id"})};
 r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
})}
async function loadUploads(){
 try{
 objectUrls.forEach(URL.revokeObjectURL);objectUrls=[];
 const db=await dbOpen(),rows=await new Promise((res,rej)=>{let r=db.transaction("tracks").objectStore("tracks").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
 localTracks=rows.map(x=>{let url=URL.createObjectURL(x.blob);objectUrls.push(url);return{id:x.id,title:x.name,artist:"Your upload",cover:images.studio,url,local:true}});
 db.close();if(["library","music","home","favorites"].includes(page))render();
 }catch(e){toast("Could not load your saved audio")}
}
async function uploadFiles(files){
 let chosen=[...files].filter(f=>f.type.startsWith("audio/"));if(!chosen.length){toast("Choose audio files");return}
 try{
 const db=await dbOpen(),tx=db.transaction("tracks","readwrite"),store=tx.objectStore("tracks");
 chosen.forEach(f=>store.put({id:crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random(),name:f.name.replace(/\.[^.]+$/,""),blob:f}));
 await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)});db.close();
 await loadUploads();toast(chosen.length+" audio file(s) added");
 }catch(e){toast("Could not save these files in this browser")}
}
async function deleteLocal(id){
 try{
 const db=await dbOpen(),tx=db.transaction("tracks","readwrite");tx.objectStore("tracks").delete(id);
 await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();
 if(current?.id===id){audio.pause();audio.removeAttribute("src");current=null;$("#nowTitle").textContent="Choose something to play";$("#nowArtist").textContent="ANAS PLAYER"}
 favs=favs.filter(x=>x!==id);lists.forEach(p=>p.tracks=p.tracks.filter(x=>x!==id));saveFav();saveLists();
 await loadUploads();toast("Upload deleted");
 }catch(e){toast("Could not delete this upload")}
}
updateProfileUI();render();loadUploads();
</script>
</body>
</html>
