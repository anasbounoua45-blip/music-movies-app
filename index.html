<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقي - موسيقى وأفلام</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1db954;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
        }
        section {
            margin-bottom: 30px;
        }
        h2 {
            border-bottom: 2px solid #1db954;
            padding-bottom: 5px;
        }
        .grid {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .card {
            background-color: #282828;
            min-width: 120px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>موسيقي وأفلامي 🎧🎬</header>

    <div class="container">
        <section>
            <h2>الموسيقى المفضلة</h2>
            <div class="grid">
                <div class="card">
                    <div style="background:#444; width:100px; height:100px; border-radius:6px; margin:0 auto; display:flex; align-items:center; justify-content:center;">🎵</div>
                    <p>أغنية 1</p>
                </div>
            </div>
        </section>

        <section>
            <h2>الأفلام والمسلسلات</h2>
            <div class="grid">
                <div class="card">
                    <div style="background:#444; width:100px; height:100px; border-radius:6px; margin:0 auto; display:flex; align-items:center; justify-content:center;">🎬</div>
                    <p>فيلم 1</p>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
